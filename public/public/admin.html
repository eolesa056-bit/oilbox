<!DOCTYPE html>
<html>
<head>
    <title>Админ-панель | Brawl Box</title>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at 20% 30%, #0a0a2a, #1a1a3e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
            color: #e94560;
        }
        .tabs {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .tab-btn {
            background: rgba(233,69,96,0.2);
            border: 1px solid #e94560;
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #e94560;
        }
        .panel {
            display: none;
            background: rgba(15,25,45,0.85);
            border-radius: 30px;
            padding: 25px;
        }
        .panel.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #2a2a5a;
            text-align: left;
        }
        th {
            background: #0f3460;
        }
        button {
            background: #e94560;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            margin: 3px;
        }
        input, select {
            background: #0f172a;
            border: 1px solid #e94560;
            padding: 8px 15px;
            border-radius: 30px;
            color: white;
            margin: 5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #f9a826;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 АДМИН-ПАНЕЛЬ</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('players')">👥 ИГРОКИ</button>
            <button class="tab-btn" onclick="switchTab('promocodes')">🎁 ПРОМОКОДЫ</button>
            <button class="tab-btn" onclick="switchTab('events')">🎉 ИВЕНТЫ</button>
            <button class="tab-btn" onclick="switchTab('reports')">📋 РЕПОРТЫ</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 СТАТИСТИКА</button>
        </div>
        
        <div id="playersPanel" class="panel active">
            <h3>👥 УПРАВЛЕНИЕ ИГРОКАМИ</h3>
            <div id="playersList"></div>
        </div>
        
        <div id="promocodesPanel" class="panel">
            <h3>🎁 ПРОМОКОДЫ</h3>
            <div>
                <input type="text" id="promoCode" placeholder="Код">
                <input type="text" id="promoReward" placeholder="Награда (100 монет)">
                <input type="number" id="promoMax" placeholder="Лимит">
                <button onclick="createPromocode()">➕ СОЗДАТЬ</button>
            </div>
            <div id="promocodesList" style="margin-top:20px;"></div>
        </div>
        
        <div id="eventsPanel" class="panel">
            <h3>🎉 ИВЕНТЫ</h3>
            <div>
                <input type="text" id="eventName" placeholder="Название">
                <select id="eventType">
                    <option value="double_cups">x2 Кубки</option>
                    <option value="free_box">Бесплатный ящик</option>
                </select>
                <input type="datetime-local" id="eventEnd">
                <button onclick="createEvent()">➕ СОЗДАТЬ</button>
            </div>
            <div id="eventsList" style="margin-top:20px;"></div>
        </div>
        
        <div id="reportsPanel" class="panel">
            <h3>📋 РЕПОРТЫ</h3>
            <div id="reportsList"></div>
        </div>
        
        <div id="statsPanel" class="panel">
            <h3>📊 СТАТИСТИКА СЕРВЕРА</h3>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>
    
    <script>
        let currentTab = 'players';
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById(tab + 'Panel').classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
            if (tab === 'players') loadPlayers();
            if (tab === 'promocodes') loadPromocodes();
            if (tab === 'events') loadEvents();
            if (tab === 'reports') loadReports();
            if (tab === 'stats') loadStats();
        }
        
        async function loadPlayers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            let html = `<table><thead><tr><th>ID</th><th>Ник</th><th>Кубки</th><th>Монеты</th><th>Гемы</th><th>Бан</th><th>Действия</th></tr></thead><tbody>`;
            for (const u of users) {
                html += `<tr>
                            <td>${u.id}</td>
                            <td>${u.nickname}</td>
                            <td>${u.cups || 0}</td>
                            <td>${u.coins || 0}</td>
                            <td>${u.gems || 0}</td>
                            <td>${u.is_banned ? '⛔ Да' : '✅ Нет'}</td>
                            <td>
                                ${!u.is_banned ? `<button onclick="banUser(${u.id})">🔨 БАН</button>` : `<button onclick="unbanUser(${u.id})">✅ РАЗБАН</button>`}
                                <button onclick="addCoins(${u.id})">💰 +100</button>
                                <button onclick="addGems(${u.id})">💎 +10</button>
                            </td>
                        </tr>`;
            }
            html += `</tbody></table>`;
            document.getElementById('playersList').innerHTML = html;
        }
        
        async function banUser(userId) {
            const reason = prompt('Причина бана:');
            if (!reason) return;
            await fetch('/api/ban', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId, reason, hours: 0 }) });
            loadPlayers();
        }
        
        async function unbanUser(userId) {
            await fetch('/api/unban', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId }) });
            loadPlayers();
        }
        
        async function addCoins(userId) {
            await fetch('/api/add_coins', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ playerId: userId, coins: 100 }) });
            loadPlayers();
        }
        
        async function addGems(userId) {
            await fetch('/api/add_gems', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ playerId: userId, gems: 10 }) });
            loadPlayers();
        }
        
        async function loadPromocodes() {
            const res = await fetch('/api/promocodes');
            const promos = await res.json();
            let html = `<table><thead><tr><th>Код</th><th>Награда</th><th>Активации</th><th>Действия</th></tr></thead><tbody>`;
            for (const p of promos) {
                html += `<tr><td>${p.code}</td><td>${p.reward}</td><td>${p.current_activations}/${p.max_activations}</td><td><button onclick="deletePromocode(${p.id})">🗑 Удалить</button></td></tr>`;
            }
            html += `</tbody></table>`;
            document.getElementById('promocodesList').innerHTML = html;
        }
        
        async function createPromocode() {
            const code = document.getElementById('promoCode').value;
            const reward = document.getElementById('promoReward').value;
            const max = parseInt(document.getElementById('promoMax').value);
            if (!code || !reward || !max) return alert('Заполните все поля');
            await fetch('/api/create_promo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, reward, max }) });
            loadPromocodes();
            document.getElementById('promoCode').value = '';
            document.getElementById('promoReward').value = '';
            document.getElementById('promoMax').value = '';
        }
        
        async function deletePromocode(id) {
            await fetch('/api/delete_promo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadPromocodes();
        }
        
        async function loadEvents() {
            const res = await fetch('/api/events');
            const events = await res.json();
            let html = `<table><thead><tr><th>Название</th><th>Тип</th><th>До</th><th>Действия</th></tr></thead><tbody>`;
            for (const e of events) {
                html += `<tr><td>${e.name}</td><td>${e.event_type}</td><td>${new Date(e.end_time).toLocaleString()}</td><td><button onclick="stopEvent(${e.id})">⏹ Остановить</button></td></tr>`;
            }
            html += `</tbody></table>`;
            document.getElementById('eventsList').innerHTML = html;
        }
        
        async function createEvent() {
            const name = document.getElementById('eventName').value;
            const type = document.getElementById('eventType').value;
            const end_time = document.getElementById('eventEnd').value;
            if (!name || !end_time) return alert('Заполните поля');
            await fetch('/api/create_event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, type, end_time }) });
            loadEvents();
            document.getElementById('eventName').value = '';
            document.getElementById('eventEnd').value = '';
        }
        
        async function stopEvent(eventId) {
            await fetch('/api/stop_event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ eventId }) });
            loadEvents();
        }
        
        async function loadReports() {
            const res = await fetch('/api/reports');
            const reports = await res.json();
            if (reports.length === 0) {
                document.getElementById('reportsList').innerHTML = '<p>Нет жалоб</p>';
                return;
            }
            let html = `<table><thead><tr><th>От</th><th>На</th><th>Причина</th><th>Действия</th></tr></thead><tbody>`;
            for (const r of reports) {
                html += `<tr><td>${r.from_nick}</td><td>${r.to_nick}</td><td>${r.reason}</td><td><button onclick="resolveReport(${r.id}, 'ban')">🔨 Забанить</button><button onclick="resolveReport(${r.id}, 'reject')">❌ Отклонить</button></td></tr>`;
            }
            html += `</tbody></table>`;
            document.getElementById('reportsList').innerHTML = html;
        }
        
        async function resolveReport(reportId, action) {
            await fetch('/api/resolve_report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reportId, action }) });
            loadReports();
        }
        
        async function loadStats() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const totalCups = users.reduce((s, u) => s + (u.cups || 0), 0);
            const totalCoins = users.reduce((s, u) => s + (u.coins || 0), 0);
            const totalGems = users.reduce((s, u) => s + (u.gems || 0), 0);
            const html = `
                <div class="stat-card"><div class="stat-number">${users.length}</div><div>👥 Игроков</div></div>
                <div class="stat-card"><div class="stat-number">${totalCups}</div><div>🏆 Всего кубков</div></div>
                <div class="stat-card"><div class="stat-number">${totalCoins}</div><div>💰 Всего монет</div></div>
                <div class="stat-card"><div class="stat-number">${totalGems}</div><div>💎 Всего гемов</div></div>
            `;
            document.getElementById('statsGrid').innerHTML = html;
        }
        
        loadPlayers();
    </script>
</body>
</html>
